<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" role="img" aria-labelledby="title desc" font-family="Inter, system-ui, sans-serif">
  <title id="title">Mezenta cannot reach the private Dokploy control plane</title>
  <desc id="desc">Two servers: a public app server running Mezenta and a Tailscale-only Dokploy host. The deploy webhook between them is blocked.</desc>
  <defs>
    <marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f87171" />
    </marker>
  </defs>

  <!-- App server -->
  <rect x="40" y="90" width="300" height="180" rx="14" fill="#161616" stroke="#2a2a2a" stroke-width="1.5" />
  <text x="62" y="122" font-size="15" font-weight="700" fill="#f5f5f5">APP SERVER</text>
  <text x="62" y="142" font-size="12" fill="#737373">public · e.g. 203.0.113.10</text>
  <line x1="62" y1="156" x2="318" y2="156" stroke="#2a2a2a" stroke-width="1" />
  <text x="62" y="186" font-size="14" font-weight="600" fill="#e5e5e5">Mezenta (central app)</text>
  <text x="62" y="208" font-size="13" fill="#a3a3a3">saves a menu</text>
  <text x="62" y="228" font-size="13" fill="#a3a3a3">wants to trigger a rebuild</text>

  <!-- Dokploy host -->
  <rect x="560" y="90" width="300" height="180" rx="14" fill="#161616" stroke="#2a2a2a" stroke-width="1.5" />
  <rect x="782" y="74" width="92" height="24" rx="12" fill="#1f2937" stroke="#374151" />
  <text x="828" y="90" text-anchor="middle" font-size="12" font-weight="600" fill="#62d0ff">Tailscale</text>
  <text x="582" y="122" font-size="15" font-weight="700" fill="#f5f5f5">DOKPLOY HOST</text>
  <text x="582" y="142" font-size="12" fill="#737373">private · 100.64.5.42:3000</text>
  <line x1="582" y1="156" x2="838" y2="156" stroke="#2a2a2a" stroke-width="1" />
  <text x="582" y="186" font-size="14" font-weight="600" fill="#e5e5e5">Dokploy control plane</text>
  <text x="582" y="208" font-size="13" fill="#a3a3a3">deploys the restaurant sites</text>
  <text x="582" y="228" font-size="13" fill="#a3a3a3">reachable only via Tailscale</text>

  <!-- Blocked arrow -->
  <line x1="340" y1="180" x2="560" y2="180" stroke="#f87171" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#redArrow)" />
  <text x="450" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#f87171">blocked</text>
  <text x="450" y="216" text-anchor="middle" font-size="12" fill="#737373">no public route to the deploy webhook</text>
</svg>
