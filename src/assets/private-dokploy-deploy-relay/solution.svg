<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="100%" role="img" aria-labelledby="title desc" font-family="Inter, system-ui, sans-serif">
  <title id="title">The deploy relay and constrained SSH tunnel</title>
  <desc id="desc">A public relay on the Dokploy host, exposed to the app server through a constrained SSH tunnel, forwards validated deploy webhooks to Dokploy's private network.</desc>
  <defs>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#62d0ff" />
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399" />
    </marker>
  </defs>

  <!-- Zone: app server -->
  <rect x="24" y="40" width="430" height="600" rx="16" fill="#0e0e0e" stroke="#262626" stroke-width="1.5" />
  <text x="48" y="72" font-size="14" font-weight="700" letter-spacing="1" fill="#9ca3af">APP SERVER · PUBLIC</text>

  <!-- Mezenta box -->
  <rect x="52" y="96" width="374" height="86" rx="12" fill="#161616" stroke="#2a2a2a" stroke-width="1.5" />
  <text x="72" y="126" font-size="15" font-weight="700" fill="#f5f5f5">Mezenta (central app)</text>
  <text x="72" y="148" font-size="12.5" fill="#a3a3a3">menu save → POST /deploy</text>
  <text x="72" y="166" font-size="12.5" fill="#a3a3a3">bearer secret + stored deploy hook</text>

  <!-- Traefik box -->
  <rect x="52" y="224" width="374" height="86" rx="12" fill="#161616" stroke="#2a2a2a" stroke-width="1.5" />
  <text x="72" y="254" font-size="15" font-weight="700" fill="#f5f5f5">Traefik (edge)</text>
  <text x="72" y="276" font-size="12.5" fill="#a3a3a3">https://relay.example.com</text>
  <text x="72" y="294" font-size="12.5" fill="#a3a3a3">→ http://172.17.0.1:4300</text>

  <!-- Tunnel client box -->
  <rect x="52" y="352" width="374" height="86" rx="12" fill="#161616" stroke="#2a2a2a" stroke-width="1.5" />
  <text x="72" y="382" font-size="15" font-weight="700" fill="#f5f5f5">SSH tunnel client</text>
  <text x="72" y="404" font-size="12.5" fill="#a3a3a3">systemd: mezenta-relay-tunnel.service</text>
  <text x="72" y="422" font-size="12.5" fill="#a3a3a3">172.17.0.1:4300 → relay:3000</text>

  <!-- Restaurant site box -->
  <rect x="52" y="512" width="374" height="86" rx="12" fill="#161616" stroke="#34d399" stroke-width="1.5" />
  <text x="72" y="542" font-size="15" font-weight="700" fill="#f5f5f5">Restaurant site (static)</text>
  <text x="72" y="564" font-size="12.5" fill="#a3a3a3">fetches menu at build time</text>
  <text x="72" y="582" font-size="12.5" fill="#a3a3a3">redeployed on every save</text>

  <!-- Zone: dokploy host -->
  <rect x="506" y="40" width="430" height="600" rx="16" fill="#0e0e0e" stroke="#262626" stroke-width="1.5" />
  <text x="530" y="72" font-size="14" font-weight="700" letter-spacing="1" fill="#62d0ff">DOKPLOY HOST · TAILSCALE ONLY</text>

  <!-- Dokploy box -->
  <rect x="534" y="96" width="374" height="104" rx="12" fill="#161616" stroke="#2a2a2a" stroke-width="1.5" />
  <text x="554" y="126" font-size="15" font-weight="700" fill="#f5f5f5">Dokploy control plane</text>
  <text x="554" y="148" font-size="12.5" fill="#a3a3a3">http://dokploy:3000</text>
  <text x="554" y="166" font-size="12.5" fill="#a3a3a3">/api/deploy/&lt;token&gt;</text>
  <text x="554" y="184" font-size="12.5" fill="#a3a3a3">never exposed publicly</text>

  <!-- Relay box -->
  <rect x="534" y="352" width="374" height="86" rx="12" fill="#161616" stroke="#62d0ff" stroke-width="1.5" />
  <text x="554" y="382" font-size="15" font-weight="700" fill="#f5f5f5">deploy-webhook-relay</text>
  <text x="554" y="404" font-size="12.5" fill="#a3a3a3">node server.mjs · :3000</text>
  <text x="554" y="422" font-size="12.5" fill="#a3a3a3">joined to dokploy-network</text>

  <!-- 1: Mezenta → Traefik -->
  <line x1="239" y1="182" x2="239" y2="224" stroke="#62d0ff" stroke-width="2.5" marker-end="url(#blueArrow)" />
  <text x="246" y="206" font-size="12" font-weight="700" fill="#62d0ff">1</text>

  <!-- 2: Traefik → tunnel client -->
  <line x1="239" y1="310" x2="239" y2="352" stroke="#62d0ff" stroke-width="2.5" marker-end="url(#blueArrow)" />
  <text x="246" y="334" font-size="12" font-weight="700" fill="#62d0ff">2</text>

  <!-- 3: tunnel client → relay (crosses the gap) -->
  <line x1="426" y1="395" x2="534" y2="395" stroke="#62d0ff" stroke-width="2.5" marker-end="url(#blueArrow)" />
  <text x="478" y="386" text-anchor="middle" font-size="12" font-weight="700" fill="#62d0ff">3</text>
  <text x="478" y="418" text-anchor="middle" font-size="11.5" fill="#737373">SSH tunnel</text>

  <!-- 4: relay → Dokploy -->
  <line x1="720" y1="352" x2="720" y2="200" stroke="#62d0ff" stroke-width="2.5" marker-end="url(#blueArrow)" />
  <text x="728" y="280" font-size="12" font-weight="700" fill="#62d0ff">4</text>

  <!-- 5: Dokploy → restaurant site (through the gap between zones) -->
  <path d="M 534 148 L 470 148 L 470 555 L 426 555" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#greenArrow)" />
  <text x="478" y="264" text-anchor="middle" font-size="12" font-weight="700" fill="#34d399">5</text>
  <text x="478" y="300" text-anchor="middle" font-size="11.5" fill="#34d399">deploys the</text>
  <text x="478" y="316" text-anchor="middle" font-size="11.5" fill="#34d399">static site</text>
</svg>
