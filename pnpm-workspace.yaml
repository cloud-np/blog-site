# pnpm v10 refuses to silently ignore packages with build scripts; each one
# must be classified as either built or ignored or `install` exits 1.
onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@tailwindcss/oxide"
  - esbuild
ignoredBuiltDependencies:
  # sharp ships prebuilt platform binaries, so it doesn't need its build script.
  - sharp
